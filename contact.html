<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contacter Najet Zridette pour une alternance en informatique, spécialité gouvernance, risques et conformité (GRC).">
    <title>Najet Zridette - Contact</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">Najet Zridette</a>
            <div class="menu">
                <a href="index.html">Accueil</a>
                <a href="projets.html">Projets</a>
                <a href="parcours.html">Parcours</a>
                <a href="contact.html" class="actif">Contact</a>
            </div>
        </nav>
    </header>

    <main>
        <p class="surtitre">Contact</p>
        <h1>Me contacter</h1>

        <div class="contact">
            <section class="carte carte-sombre">
                <h2>Mes coordonnées</h2>
                <ul class="coordonnees">
                    <li><span>Email</span><a href="mailto:najetzridette@gmail.com">najetzridette@gmail.com</a></li>
                    <li><span>LinkedIn</span><a href="https://www.linkedin.com/in/najet-zridette">linkedin.com/in/najet-zridette</a></li>
                    <li><span>GitHub</span><a href="https://github.com/najetzridette">github.com/najetzridette</a></li>
                </ul>
            </section>

            <section class="carte">
                <form action="https://formspree.io/f/TON_IDENTIFIANT" method="POST">
                    <h2>M'écrire</h2>

                    <label for="nom">Nom</label>
                    <input type="text" id="nom" name="nom" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>

                    <button type="submit" class="bouton">Envoyer</button>
                </form>
            </section>
        </div>
    </main>
</body>
</html>
